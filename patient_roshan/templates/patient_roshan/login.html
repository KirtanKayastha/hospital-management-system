<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | HM System</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-[#f7f9fb] flex items-center justify-center">
    <div class="bg-white border border-[#c3c6d7] rounded-xl shadow-sm p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-[#004ac6] mb-1">HM System</h1>
        <p class="text-sm text-[#434655] mb-6">Patient Portal — Sign in to continue</p>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-semibold text-[#434655] mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-[#c3c6d7] rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#004ac6]"
                    placeholder="Enter your username"/>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-[#434655] mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-[#c3c6d7] rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#004ac6]"
                    placeholder="Enter your password"/>
            </div>
            <button type="submit"
                class="w-full bg-[#004ac6] text-white py-2 rounded-lg text-sm font-bold hover:opacity-90 transition">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
