{% extends 'base.html' %}

{% block title %}Check Your Email | HM System{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center pt-xxl pb-xxl px-md">
    <div class="w-full max-w-[440px] bg-surface-container-lowest rounded-lg login-card-shadow p-xl md:p-xxl flex flex-col items-center text-center">
        <span class="material-symbols-outlined text-5xl text-primary mb-4">mark_email_read</span>
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Check Your Email</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-lg">
            We've sent you a password reset link. Please check your inbox and follow the instructions to reset your password.
        </p>
        <a href="/login/" class="text-primary hover:underline text-sm font-medium">← Back to Login</a>
    </div>
</main>
{% endblock %}
