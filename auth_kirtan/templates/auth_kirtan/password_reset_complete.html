{% extends 'base.html' %}

{% block title %}Password Reset Complete | HM System{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center pt-xxl pb-xxl px-md">
    <div class="w-full max-w-[440px] bg-surface-container-lowest rounded-lg login-card-shadow p-xl md:p-xxl flex flex-col items-center text-center">
        <span class="material-symbols-outlined text-5xl text-primary mb-4">check_circle</span>
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Password Reset Complete</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-lg">
            Your password has been successfully reset. You can now log in with your new password.
        </p>
        <a href="/login/" class="bg-primary hover:bg-primary-container text-white py-md px-xl rounded-lg font-label-md text-label-md shadow-md hover:shadow-lg transition-all duration-200">Login Now</a>
    </div>
</main>
{% endblock %}
