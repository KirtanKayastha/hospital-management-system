{% extends 'base.html' %}

{% block title %}Reset Password | HM System{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="w-full max-w-md bg-white rounded-xl border border-outline-variant p-8 shadow-sm">
        <div class="text-center mb-6">
            <span class="material-symbols-outlined text-5xl text-primary">lock_reset</span>
            <h1 class="text-2xl font-bold text-on-surface mt-2">Reset Password</h1>
            <p class="text-sm text-on-surface-variant">Enter your email and we'll send you a reset link.</p>
        </div>

        <form action="/forgot-password/" method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-on-surface mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="name@example.com">
            </div>
            <button type="submit" class="w-full bg-primary text-white font-medium py-2.5 rounded-lg hover:opacity-90 transition">Send Reset Link</button>
        </form>

        <div class="mt-4 text-center">
            <a href="/login/" class="text-primary hover:underline text-sm">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
