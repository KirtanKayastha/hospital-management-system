{% extends 'base.html' %}

{% block title %}Register | HM System{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-xl border border-outline-variant p-8 shadow-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-on-surface">Create Account</h1>
            <p class="text-sm text-on-surface-variant">Join our hospital management system</p>
        </div>

        <form action="/register/" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="block text-sm font-medium text-on-surface mb-1">Full Name</label>
                <input type="text" name="full_name" required class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="John Smith">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-on-surface mb-1">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="john@example.com">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-on-surface mb-1">Phone</label>
                <input type="tel" name="phone" class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none" placeholder="+977 98XXXXXXXX">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium text-on-surface mb-1">Role</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2"><input type="radio" name="role" value="patient" checked> Patient</label>
                    <label class="flex items-center gap-2"><input type="radio" name="role" value="doctor"> Doctor</label>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-sm font-medium text-on-surface mb-1">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-on-surface mb-1">Confirm</label>
                    <input type="password" name="confirm_password" required class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                </div>
            </div>
            <div class="mb-4">
                <label class="flex items-center gap-2 text-sm text-on-surface-variant">
                    <input type="checkbox" required> I agree to the Terms & Conditions
                </label>
            </div>
            <button type="submit" class="w-full bg-primary text-white font-medium py-2.5 rounded-lg hover:opacity-90 transition">Register</button>
        </form>

        <div class="mt-4 text-center text-sm text-on-surface-variant">
            Already have an account? <a href="/login/" class="text-primary font-bold hover:underline">Login</a>
        </div>
    </div>
</div>
{% endblock %}
