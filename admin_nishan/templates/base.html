{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Your App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <!-- Tailwind Config -->
    <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        content: [
            "./**/*.html",
            "./**/*.js"
        ],
        theme: {
            extend: {
                colors: {
                    "on-tertiary-container": "#ffeedd",
                    "on-secondary-fixed-variant": "#005236",
                    "on-secondary-fixed": "#002113",
                    "on-secondary-container": "#00714d",
                    "surface-tint": "#0053db",
                    "surface-container": "#eceef0",
                    "on-primary-container": "#eeefff",
                    "inverse-surface": "#2d3133",
                    "on-surface-variant": "#434655",
                    "surface": "#f7f9fb",
                    "secondary": "#006c49",
                    "on-background": "#191c1e",
                    "surface-bright": "#f7f9fb",
                    "primary": "#004ac6",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#6ffbbe",
                    "on-primary-fixed": "#00174b",
                    "outline-variant": "#c3c6d7",
                    "error": "#ba1a1a",
                    "outline": "#737686",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "background": "#f7f9fb",
                    "secondary-fixed-dim": "#4edea3",
                    "surface-container-low": "#f2f4f6",
                    "primary-fixed": "#dbe1ff",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#191c1e",
                    "on-tertiary-fixed-variant": "#653e00",
                    "primary-fixed-dim": "#b4c5ff",
                    "inverse-primary": "#b4c5ff",
                    "inverse-on-surface": "#eff1f3",
                    "surface-variant": "#e0e3e5",
                    "surface-dim": "#d8dadc",
                    "surface-container-high": "#e6e8ea",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#2563eb",
                    "tertiary": "#784b00",
                    "secondary-container": "#6cf8bb",
                    "tertiary-fixed": "#ffddb8",
                    "on-tertiary-fixed": "#2a1700",
                    "tertiary-container": "#996100",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-secondary": "#ffffff"
                },
                borderRadius: {
                    DEFAULT: "0.25rem",
                    lg: "0.5rem",
                    xl: "0.75rem",
                    full: "9999px"
                },
                spacing: {
                    xs: "4px",
                    sm: "8px",
                    md: "16px",
                    lg: "24px",
                    xl: "32px",
                    xxl: "48px",
                    gutter: "24px",
                    base: "4px",
                    "container-max": "1280px"
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"],
                },
                fontSize: {
                    "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600" }],
                    "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                    "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                    "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }],
                    "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }],
                    "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
                    "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                    "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                    "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                }
            }
        }
    }
    </script>

    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f7f9fb;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .chart-bar-transition {
            transition: height 1s ease-out;
        }
        
        /* Smooth sidebar transition support */
        .sidebar-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-on-surface overflow-hidden bg-surface">

    {% include "includes/sidebar.html" %}

    <!-- Navbar can be uncommented when ready -->
    <!-- {% include "includes/navbar.html" %} -->

    <main class="ml-64 pt-16 h-screen overflow-y-auto bg-surface">
        {% block content %}
        <!-- Child templates will override this -->
        {% endblock %}
    </main>

    {% block scripts %}
    <!-- Child templates can add scripts here -->
    {% endblock %}

</body>
</html>
