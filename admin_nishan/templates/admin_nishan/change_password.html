{% extends "admin_nishan/base.html" %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-xl shadow p-8">
    <h2 class="text-2xl font-bold mb-6">{{ title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label class="block mb-2 font-label-md text-label-md text-on-surface">New Password</label>
                {{ form.new_password1 }}
            </div>
            <div>
                <label class="block mb-2 font-label-md text-label-md text-on-surface">Confirm Password</label>
                {{ form.new_password2 }}
            </div>
        </div>
        <div class="flex flex-col sm:flex-row sm:justify-end gap-4 mt-6">
            <a href="{% url 'admin_nishan:admin_manage_doctor' %}"
               class="px-5 py-2 min-h-[44px] flex items-center justify-center rounded-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-colors">
                Cancel
            </a>
            <button type="submit"
                    class="px-5 py-2 min-h-[44px] rounded-lg bg-primary text-white hover:bg-primary/90 transition-colors">
                Change Password
            </button>
        </div>
    </form>
</div>
{% endblock %}
