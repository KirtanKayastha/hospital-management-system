{% extends "admin_nishan/base.html" %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-xl shadow p-8">

    <h2 class="text-2xl font-bold mb-6">
        {{ title }}
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="flex flex-col sm:flex-row sm:justify-end gap-4 mt-6">

            <a href="{% url 'admin_nishan:admin_manage_doctor' %}"
               class="px-5 py-2 min-h-[44px] flex items-center justify-center rounded-lg bg-gray-300 hover:bg-gray-400">

                Cancel

            </a>

            <button
                type="submit"
                class="px-5 py-2 min-h-[44px] rounded-lg bg-blue-600 hover:bg-blue-700 text-white">

                Change Password

            </button>

        </div>

    </form>

</div>

{% endblock %}
