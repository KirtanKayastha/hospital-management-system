services:
  - type: web
    name: hospital-management-system
    plan: free
    build:
      command: bash build.sh
    env: python
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: admin12345
      - key: DEBUG
        value: "False"
